apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: snakegame
  name: snakegame-deployment
spec:
  replicas: 6
  selector:
    matchLabels:
      app: snakegame
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: snakegame
    spec:
      containers:
        - image: ankit2507/neon-snake-game:v1
          name: snakegame
