apiVersion: v1
kind: Namespace
metadata:
  name: alpha
  labels:
    env: testing
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: game1
    app: nginx
  name: game1
  namespace: alpha
spec:
  containers:
    - image: ankit2507/neon-snake-game:v1
      name: neon-snake-game
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: game2
    app: nginx
  name: game2
  namespace: alpha
spec:
  containers:
    - image: ankit2507/neon-snake-game:v1
      name: neon-snake-game
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend
  labels:
    app: guestbook
    tier: frontend
spec:
  # modify replicas according to your case
  replicas: 3
  selector:
    matchLabels:
      tier: frontend
  template:
    metadata:
      labels:
        tier: frontend
    spec:
      containers:
        - name: kubegame
          image: ankit2507/neon-snake-game:v1
